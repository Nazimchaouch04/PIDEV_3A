security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: /redirect-after-login
                always_use_default_target_path: true
            logout:
                path: app_logout
                target: app_landing
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/certification, roles: PUBLIC_ACCESS }
        - { path: ^/api/face/status, roles: PUBLIC_ACCESS }
        - { path: ^/api/face/generate-embedding, roles: PUBLIC_ACCESS }
        - { path: ^/api/face/register-face, roles: PUBLIC_ACCESS }
        - { path: ^/api/face/login, roles: PUBLIC_ACCESS }
        - { path: ^/redirect-after-login, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }
        - { path: ^/admin/community/ai, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10